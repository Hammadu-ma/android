workflows:
  android-native-workflow:
    name: Alif Med Native - Android
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build release APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
